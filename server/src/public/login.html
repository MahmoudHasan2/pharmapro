<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - PharmaPro</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root { --primary:#102032; --secondary:#8767aa; --light:#eaeaea; --white:#ffffff; --danger:#e74c3c; --text-muted:#6b7280; --border:#e5e7eb; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Cairo',sans-serif; background:linear-gradient(135deg, var(--primary), #1a3350 60%, var(--secondary)); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.login-card { background:var(--white); border-radius:20px; width:100%; max-width:420px; padding:40px 36px; box-shadow:0 20px 60px rgba(0,0,0,0.25); }
.login-logo { width:64px; height:64px; background:var(--secondary); border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:28px; color:white; margin:0 auto 16px; }
.login-title { text-align:center; font-size:22px; font-weight:800; color:var(--primary); margin-bottom:4px; }
.login-subtitle { text-align:center; font-size:13px; color:var(--text-muted); margin-bottom:28px; }
.form-group { margin-bottom:18px; }
.form-label { display:block; font-size:13px; font-weight:600; color:var(--primary); margin-bottom:8px; }
.input-wrap { position:relative; }
.input-wrap i { position:absolute; right:16px; top:50%; transform:translateY(-50%); color:var(--text-muted); }
.form-input { width:100%; padding:13px 44px 13px 16px; border:2px solid var(--border); border-radius:12px; font-family:'Cairo'; font-size:14px; transition:all 0.3s; }
.form-input:focus { outline:none; border-color:var(--secondary); box-shadow:0 0 0 4px rgba(135,103,170,0.1); }
.remember-row { display:flex; align-items:center; gap:8px; margin-bottom:22px; font-size:13px; color:var(--text-muted); }
.btn-login { width:100%; padding:14px; background:var(--secondary); color:white; border:none; border-radius:12px; font-family:'Cairo'; font-weight:700; font-size:15px; cursor:pointer; transition:all 0.3s; box-shadow:0 6px 20px rgba(135,103,170,0.35); }
.btn-login:hover { background:#765a9e; transform:translateY(-2px); }
.btn-login:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
.error-box { background:rgba(231,76,60,0.1); color:var(--danger); padding:10px 14px; border-radius:10px; font-size:13px; margin-bottom:16px; display:none; }
.demo-hint { text-align:center; font-size:12px; color:var(--text-muted); margin-top:20px; }
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo"><i class="fas fa-pills"></i></div>
    <div class="login-title">PharmaPro</div>
    <div class="login-subtitle">نظام إدارة الصيدليات - سجّل الدخول للمتابعة</div>

    <div class="error-box" id="errorBox"></div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">اسم المستخدم</label>
        <div class="input-wrap">
          <i class="fas fa-user"></i>
          <input type="text" class="form-input" id="username" required autofocus>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">كلمة المرور</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" class="form-input" id="password" required>
        </div>
      </div>
      <div class="remember-row">
        <input type="checkbox" id="rememberMe">
        <label for="rememberMe">تذكرني</label>
      </div>
      <button type="submit" class="btn-login" id="loginBtn">تسجيل الدخول</button>
    </form>
  </div>

  <script src="app-config.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('loginBtn');
    const errorBox = document.getElementById('errorBox');

    // If already logged in, skip straight to the dashboard
    if (localStorage.getItem('token')) window.location.href = 'index.html';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'جارِ الدخول...';
      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            rememberMe: document.getElementById('rememberMe').checked,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'حدث خطأ أثناء تسجيل الدخول');
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = 'index.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'تسجيل الدخول';
      }
    });
  </script>
</body>
</html>
