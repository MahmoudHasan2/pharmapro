<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صيدلية برو - تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: {
                        primary: '#0ea5e9',
                        secondary: '#6366f1',
                        accent: '#06b6d4',
                        dark: '#0f172a',
                        surface: '#1e293b'
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Cairo', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
            min-height: 100vh;
            overflow: hidden;
        }
        .particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .particle {
            position: absolute; border-radius: 50%;
            background: rgba(14, 165, 233, 0.3);
            animation: float 15s infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .input-glow:focus {
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.4);
            border-color: #0ea5e9;
        }
        .btn-shine {
            position: relative; overflow: hidden;
        }
        .btn-shine::after {
            content: ''; position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }
        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }
        .logo-pulse {
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(14, 165, 233, 0.3); }
            50% { box-shadow: 0 0 40px rgba(14, 165, 233, 0.6); }
        }
        .typing-effect::after {
            content: '|'; animation: blink 1s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body class="flex items-center justify-center relative">
    <div class="particles" id="particles"></div>

    <div class="glass-card rounded-3xl p-10 w-full max-w-md mx-4 relative z-10 transform transition-all duration-500 hover:scale-[1.02]">
        <div class="text-center mb-8">
            <div class="w-24 h-24 mx-auto bg-gradient-to-br from-primary to-secondary rounded-2xl flex items-center justify-center logo-pulse mb-4">
                <i class="fas fa-mortar-pestle text-4xl text-white"></i>
            </div>
            <h1 class="text-3xl font-black text-white mb-2">صيدلية <span class="text-primary">برو</span></h1>
            <p class="text-gray-400 text-sm typing-effect" id="typing">نظام إدارة الصيدليات المتكامل</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div class="relative">
                <i class="fas fa-user absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="username" value="tap" 
                    class="w-full bg-surface/50 border border-gray-700 rounded-xl py-3.5 pr-12 pl-4 text-white placeholder-gray-500 input-glow transition-all duration-300 outline-none"
                    placeholder="اسم المستخدم">
            </div>
            <div class="relative">
                <i class="fas fa-lock absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="password" id="password" value="tap"
                    class="w-full bg-surface/50 border border-gray-700 rounded-xl py-3.5 pr-12 pl-4 text-white placeholder-gray-500 input-glow transition-all duration-300 outline-none"
                    placeholder="كلمة المرور">
                <button type="button" onclick="togglePassword()" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition">
                    <i class="fas fa-eye" id="eyeIcon"></i>
                </button>
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center gap-2 text-gray-400 cursor-pointer">
                    <input type="checkbox" class="w-4 h-4 rounded border-gray-600 bg-surface accent-primary">
                    <span>تذكرني</span>
                </label>
                <a href="#" class="text-primary hover:text-accent transition">نسيت كلمة المرور؟</a>
            </div>

            <button type="submit" class="btn-shine w-full bg-gradient-to-r from-primary to-secondary text-white font-bold py-4 rounded-xl hover:shadow-lg hover:shadow-primary/30 transition-all duration-300 transform hover:-translate-y-0.5">
                <i class="fas fa-sign-in-alt ml-2"></i> تسجيل الدخول
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-gray-500 text-xs">الإصدار 3.0 - نظام ذكي متكامل</p>
        </div>
    </div>

    <script>
        // Particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.width = Math.random() * 6 + 2 + 'px';
            p.style.height = p.style.width;
            p.style.left = Math.random() * 100 + '%';
            p.style.top = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 15 + 's';
            p.style.animationDuration = (Math.random() * 10 + 10) + 's';
            particlesContainer.appendChild(p);
        }

        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (user === 'tap' && pass === 'tap') {
                localStorage.setItem('pharmacy_auth', 'true');
                localStorage.setItem('pharmacy_user', user);
                localStorage.setItem('login_time', new Date().toISOString());

                const btn = this.querySelector('button[type="submit"]');
                btn.innerHTML = '<i class="fas fa-spinner fa-spin ml-2"></i> جاري الدخول...';
                btn.classList.add('scale-95');

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1200);
            } else {
                const input = document.getElementById('password');
                input.classList.add('border-red-500', 'animate-shake');
                setTimeout(() => input.classList.remove('border-red-500', 'animate-shake'), 1000);

                // Show error notification
                showNotification('خطأ في اسم المستخدم أو كلمة المرور', 'error');
            }
        });

        function showNotification(msg, type) {
            const div = document.createElement('div');
            div.className = `fixed top-4 left-1/2 -translate-x-1/2 px-6 py-3 rounded-xl text-white font-bold z-50 transform transition-all duration-300 ${type === 'error' ? 'bg-red-500' : 'bg-green-500'}`;
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => { div.style.opacity = '0'; setTimeout(() => div.remove(), 300); }, 3000);
        }

        // Typing effect
        const texts = ['نظام إدارة الصيدليات المتكامل', 'ذكاء اصطناعي متقدم', 'تقارير وتحليلات ذكية', 'إدارة المخزون المتكاملة'];
        let textIdx = 0, charIdx = 0;
        const typingEl = document.getElementById('typing');

        function typeText() {
            if (charIdx < texts[textIdx].length) {
                typingEl.textContent = texts[textIdx].substring(0, charIdx + 1);
                charIdx++;
                setTimeout(typeText, 80);
            } else {
                setTimeout(() => {
                    charIdx = 0;
                    textIdx = (textIdx + 1) % texts.length;
                    typeText();
                }, 2500);
            }
        }
        setTimeout(typeText, 1000);
    </script>
</body>
</html>
